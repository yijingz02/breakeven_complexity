# Gray Scott Dataset Training Configuration
# Data format: data_0_u.npy, data_0_v.npy, ..., data_9_u.npy, data_9_v.npy
# Two fields (u and v) auto-detected and stacked as channels
# Validation/Test: data_val_u*.npy, data_val_v*.npy files
# Set the directory path in src/utils/data_utils.py GRAYSCOTT_SPECS['main_path']

train_datasets: ['grayscott']
valid_datasets: ['grayscott']
test_datasets: ['grayscott']  # Uses _val.npy files automatically

# Model settings
model: 'disco_house'
patch_size: 16
embed_dim: 384
num_heads: 6
processor_blocks: 12
bias_type: 'rel'
drop_path: 0.1
max_steps: 32
rtol: 5e-6
n_states: 12
hpnn_head_hidden_dim: 384
ndims: [2]
integration_library: "torchdiffeq"

# Training hyperparameters
group: 'grayscott_training'
run_name: 'gs_train'
pretrained: False
max_epochs: 10000
epoch_size: 100000
batch_size: 64
inference_batch_size: 64
n_past: 10             # Input timesteps
n_future: 1            # Output timesteps to predict
accum_grad: 5
val_cutoff: 10
optimizer: 'adam'
# learning_rate: 5e-5
learning_rate: 1e-3
scheduler: 'cosine'
# weight_decay: 1e-3
weight_decay: 1e-4
warmup_epochs: 1
# val_rollout: 40        # Full future horizon for GS (50 total - 10 past)
val_rollout: 190
test_max_samples_grayscott: 100
gnorm: 1.0

unroll_steps_train: 5

# Logging and checkpointing
log_to_wandb: !!bool True   # Now enabled - shows test nRMSE at the end
save_checkpoint: !!bool True
checkpoint_save_interval: 10
log_to_screen: !!bool True
num_data_workers: 4

# Data split
train_val_test: [0.8, 0.1, 0.1]
